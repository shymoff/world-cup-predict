spring.application.name=world-cup-predict
spring.web.resources.cache.cachecontrol.no-cache=true
# Frontend lezy w folderze ./frontend (w kontenerze kopiowany do classpath:/static przy budowaniu jara)
spring.web.resources.static-locations=file:./frontend/,classpath:/static/
server.port=${PORT:8080}

# Domyslnie: baza H2 zapisywana do pliku (wystarczy lokalnie, bez zewnetrznych zaleznosci).
# W produkcji (np. Render + Supabase Postgres) nadpisz zmiennymi srodowiskowymi:
#   DB_URL=jdbc:postgresql://<host-poolera>:<port>/postgres?sslmode=require
#   DB_DRIVER=org.postgresql.Driver
#   DB_USERNAME=postgres.<project-ref>
#   DB_PASSWORD=<haslo-bazy>
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/worldcup;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Konsola H2 pod /h2-console - domyslnie WYLACZONA (bezpieczenstwo w produkcji).
# Lokalnie wlacz ustawiajac H2_CONSOLE_ENABLED=true.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# --- Panel administratora ---
# Bez tego Spring wycina pole "message" z odpowiedzi bledu i panel pokazywalby
# samo "Bad Request" zamiast komunikatu walidacji (np. o wymaganym awansie po karnych).
server.error.include-message=always

# Nazwa istniejacego konta, ktore ma dostac uprawnienia admina przy starcie aplikacji.
# Konto musi byc juz zarejestrowane. Ustaw zmienna APP_ADMIN_USERNAME.
app.admin.username=${APP_ADMIN_USERNAME:}

# --- Logowanie / JWT ---
# Sekret do podpisu tokenow (min. 32 znaki). W produkcji ustaw zmienna APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:zmien-ten-sekret-na-dlugi-losowy-ciag-0123456789abcdef}
app.jwt.expiration-hours=720
